<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Primary tags -->
      <title>Praneeta Pradhan — Web Developer & Graphic Designer</title>
      <meta
         name="description"
         content="Portfolio of Praneeta Pradhan — a web developer, and graphic designer. Explore coding projects and design work including logos, brochures, flyers, and infographics."
      />
      <meta name="author" content="Praneeta Pradhan" />

      <!-- Favicons -->
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

      <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
      <meta property="og:type" content="website" />
      <meta property="og:title" content="Praneeta Pradhan — Web Developer & Graphic Designer" />
      <meta
         property="og:description"
         content="Portfolio of Praneeta Pradhan — a web developer, and graphic designer. Explore coding projects and design work including logos, brochures, flyers, and infographics."
      />
      <!-- TODO: once deployed, swap these relative paths for absolute ones,
           e.g. https://your-domain-here.com/og-image.png — some crawlers
           (esp. LinkedIn) render more reliably with absolute URLs -->
      <meta property="og:image" content="/og-image.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <!-- TODO: once deployed, replace with your real URL, e.g. https://praneeta.dev -->
      <meta property="og:url" content="https://your-domain-here.com" />
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
